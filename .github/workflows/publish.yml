name: Publish to the feed

# Reusable workflow called by the pack workflows of the ZONTAL forks. It pushes the
# .nupkg files of the caller's artifact to the static feed in docs/, which GitHub Pages
# serves at https://zontal.github.io/nuget-feed/index.json, and then restores every
# pushed package anonymously from that URL (a .NET tool package is installed instead).

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the caller's artifact that holds the .nupkg files
        type: string
        default: packages
    secrets:
      feed_deploy_key:
        description: Private SSH deploy key with write access to zontal/nuget-feed
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  FEED_URL: https://zontal.github.io/nuget-feed/
  SLEET_VERSION: 7.2.0

jobs:
  push:
    name: Push to the static feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: packages

      - uses: actions/checkout@v7
        with:
          repository: zontal/nuget-feed
          ssh-key: ${{ secrets.feed_deploy_key }}
          path: feed

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Sleet
        run: dotnet tool install --global sleet --version "$SLEET_VERSION"

      # Another fork may push the feed at the same time: every attempt starts from the
      # current main and re-runs the push, which skips the packages the feed already holds.
      - name: Push and commit
        shell: bash
        working-directory: feed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sleet push ../packages --config sleet.json --source feed --skip-existing
            if [ -z "$(git status --porcelain docs)" ]; then
              echo 'The feed already holds every package.'
              exit 0
            fi
            git add docs
            git commit --quiet -m "Add the packages of $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo 'The feed could not be pushed in 5 attempts.' >&2
          exit 1

  verify:
    name: Restore anonymously from the static feed
    needs: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: List the packages
        shell: bash
        run: |
          set -euo pipefail
          : > packages.txt
          : > libraries.txt
          : > tools.txt
          for package in packages/*.nupkg; do
            nuspec=$(unzip -p "$package" '*.nuspec')
            id=$(echo "$nuspec" | grep -oPm1 '(?<=<id>)[^<]+')
            version=$(echo "$nuspec" | grep -oPm1 '(?<=<version>)[^<]+')
            echo "$id $version" >> packages.txt
            # A .NET tool package cannot be referenced by a project; it is installed instead.
            if echo "$nuspec" | grep -q '<packageType name="DotnetTool"'; then
              echo "$id $version" >> tools.txt
            else
              echo "$id $version" >> libraries.txt
            fi
          done
          cat packages.txt

      # GitHub Pages deploys each feed commit; wait until it serves every version.
      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while read -r id version; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            until curl -fsS "${FEED_URL}flatcontainer/$lower/index.json" 2>/dev/null | grep -q "\"$version\""; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$id $version is not served at $FEED_URL." >&2
                exit 1
              fi
              sleep 15
            done
            echo "$id $version is served."
          done < packages.txt

      # A pushed package resolves only from the feed. A dependency resolves from the feed
      # when the feed serves the lowest version it admits (another fork's package), and
      # then so do the dependencies of that version; every other dependency resolves
      # from nuget.org, also when the feed holds other versions of its id.
      - name: Restore without credentials
        shell: bash
        run: |
          set -euo pipefail
          declare -A checked=()
          queue=()
          # Queues each dependency the nuspec $1 states, once per id and lowest version.
          enqueue() {
            local dependency id range minimum key
            while read -r dependency; do
              id=$(echo "$dependency" | grep -oP '(?<= id=")[^"]+')
              range=$(echo "$dependency" | { grep -oP '(?<= version=")[^"]+' || true; })
              # A bare version, or the lower bound of a range.
              minimum=$(echo "$range" | sed -E 's/^[[(]//; s/[],)].*$//; s/ //g')
              [ -n "$minimum" ] || continue
              key="${id,,}/${minimum,,}"
              [ -z "${checked[$key]:-}" ] || continue
              checked[$key]=1
              queue+=("$id ${minimum,,}")
            done < <(echo "$1" | { grep -oP '<dependency [^>]*>' || true; })
          }
          cut -d' ' -f1 packages.txt > feed-ids.txt
          while read -r id version; do
            checked["${id,,}/${version,,}"]=1
          done < packages.txt
          for package in packages/*.nupkg; do
            enqueue "$(unzip -p "$package" '*.nuspec')"
          done
          while [ "${#queue[@]}" -gt 0 ]; do
            read -r id version <<< "${queue[0]}"
            queue=("${queue[@]:1}")
            lower="${id,,}"
            if nuspec=$(curl -fsS "${FEED_URL}flatcontainer/$lower/$version/$lower.nuspec" 2>/dev/null); then
              echo "$id" >> feed-ids.txt
              enqueue "$nuspec"
            fi
          done
          sort -u -o feed-ids.txt feed-ids.txt
          cat feed-ids.txt
          mkdir restore-check
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<configuration>'
            echo '  <packageSources>'
            echo '    <clear />'
            echo '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />'
            echo "    <add key=\"zontal\" value=\"${FEED_URL}index.json\" />"
            echo '  </packageSources>'
            echo '  <packageSourceMapping>'
            echo '    <packageSource key="zontal">'
            while read -r id; do
              echo "      <package pattern=\"$id\" />"
            done < feed-ids.txt
            echo '    </packageSource>'
            echo '    <packageSource key="nuget.org">'
            echo '      <package pattern="*" />'
            echo '    </packageSource>'
            echo '  </packageSourceMapping>'
            echo '</configuration>'
          } > restore-check/nuget.config
          cd restore-check
          dotnet new classlib --framework net10.0 --name RestoreCheck --output . --no-restore
          while read -r id version; do
            dotnet add package "$id" --version "$version" --no-restore
          done < ../libraries.txt
          dotnet restore
          while read -r id version; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            grep -q "\"$lower/$version\"" obj/project.assets.json
          done < ../libraries.txt
          while read -r id version; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            dotnet tool install "$id" --version "$version" --tool-path "../tools-check/$lower" < /dev/null
            dotnet tool list --tool-path "../tools-check/$lower" \
              | awk -v id="$lower" -v version="$version" 'tolower($1) == id && $2 == version { found = 1 } END { exit !found }'
          done < ../tools.txt
